[project]
name = "ruvos-google-docs-mcp"
version = "0.1.0"
description = "Ruvos middle-layer MCP server for in-place Google Docs edits with Cursor OAuth proxy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ruvos", email = "frans@ruvos.com" }]
dependencies = [
    "fastmcp>=3.0,<5",
    "httpx>=0.27",
    "cryptography>=42.0",
    "py-key-value-aio[redis]>=0.4.4,<0.5.0",
]

[project.scripts]
ruvos-google-docs-mcp = "ruvos_google_docs_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ruvos_google_docs_mcp"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
